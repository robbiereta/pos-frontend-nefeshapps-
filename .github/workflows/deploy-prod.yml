name: Deploy to Production

# ============================================================
# Auto-deploy to production on push to master.
#
# Pipeline:
#   1. Build the Docker image (Vite build inside the image)
#   2. Push to GitHub Container Registry (ghcr.io)
#      - tagged :latest AND :sha-<short-sha>
#   3. SSH to the Hetzner box
#   4. `docker login ghcr.io` (one-shot)
#   5. `docker pull` the new sha-tagged image
#   6. Re-tag to :latest so the compose file picks it up
#   7. `docker compose up -d --build`
#   8. Prune dangling images
#
# Required GitHub Secrets:
#   HETZNER_SSH_KEY — ed25519 private key authorized on the server
#   HETZNER_HOST    — server IP (default 204.168.163.106, override via secret/var)
#   HETZNER_USER    — SSH user (default root, override via secret/var)
#
# GITHUB_TOKEN is auto-provided by GitHub Actions and has packages:write
# permission for GHCR pushes (see permissions block below).
# ============================================================

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME:   ghcr.io/robbiereta/pos-frontend
  TAG_LATEST:   latest
  TAG_SHA:      sha-${{ github.sha }}
  DEPLOY_DIR:   /nefeshapps
  COMPOSE_FILE: docker-compose.yml

jobs:
  build-and-push:
    name: Build image & push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG_LATEST }}
            ${{ env.IMAGE_NAME }}:${{ env.TAG_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH · pull · compose up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    environment: production

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Deploy on Hetzner
        env:
          HETZNER_HOST:    ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER:    ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
          IMAGE_NAME:      ${{ env.IMAGE_NAME }}
          TAG_SHA:         ${{ env.TAG_SHA }}
          TAG_LATEST:      ${{ env.TAG_LATEST }}
          DEPLOY_DIR:      ${{ env.DEPLOY_DIR }}
          COMPOSE_FILE:    ${{ env.COMPOSE_FILE }}
          GHCR_USER:       ${{ github.actor }}
          GHCR_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FULL_SHA="${IMAGE_NAME}:${TAG_SHA}"
          FULL_LATEST="${IMAGE_NAME}:${TAG_LATEST}"
          echo "Deploying ${FULL_SHA} → ${HETZNER_USER}@${HETZNER_HOST}:${DEPLOY_DIR}"

          ssh "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "${DEPLOY_DIR}" "${COMPOSE_FILE}" \
              "${FULL_SHA}" "${FULL_LATEST}" \
              "${GHCR_USER}" "${GHCR_TOKEN}" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="$1"; shift
          COMPOSE_FILE="$1"; shift
          FULL_SHA="$1"; shift
          FULL_LATEST="$1"; shift
          GHCR_USER="$1"; shift
          GHCR_TOKEN="$1"; shift

          echo "→ Login to GHCR (one-shot)"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin >/dev/null

          echo "→ cd ${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          echo "→ docker pull ${FULL_SHA}"
          docker pull "${FULL_SHA}"

          echo "→ re-tag ${FULL_SHA} → ${FULL_LATEST}"
          docker tag "${FULL_SHA}" "${FULL_LATEST}"

          echo "→ docker compose -f ${COMPOSE_FILE} up -d --build"
          docker compose -f "${COMPOSE_FILE}" up -d --build

          echo "→ prune dangling images"
          docker image prune -f

          echo "→ container status"
          docker ps --filter "name=nefeshapps-pos-frontend" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "→ image actually running"
          docker inspect --format '{{.Config.Image}}' nefeshapps-pos-frontend
          REMOTE_SCRIPT

          echo "✓ deploy complete"

      - name: Notify success
        if: success()
        run: |
          echo "## 🚀 Production deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.IMAGE_NAME }}:${{ env.TAG_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Production deploy failed for ${{ github.sha }}"
          echo "## 🚨 Production deploy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check: docker ps on the server, recent deploy logs" >> $GITHUB_STEP_SUMMARY
