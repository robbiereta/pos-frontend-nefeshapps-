name: Deploy to Production

# ============================================================
# Auto-deploy to production on push to master.
#
# Pipeline (no GHCR pull needed — works with private packages):
#   1. Build the image with docker buildx
#   2. Save to /tmp/image.tar.gz in the runner
#   3. SCP the tarball to /tmp/ on the Hetzner box
#   4. SSH in: docker load + re-tag + docker compose up
#   5. Prune dangling images
#
# Required GitHub Secrets:
#   HETZNER_SSH_KEY — ed25519 private key authorized on the server
#   HETZNER_HOST    — server IP (default 204.168.163.106)
#   HETZNER_USER    — SSH user (default root)
# ============================================================

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE_TAG:  latest
  DEPLOY_DIR: /nefeshapps
  COMPOSE:    docker-compose.yml
  CONTAINER:  nefeshapps-pos-frontend

jobs:
  build:
    name: Build image & SCP to server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build --load \
            --tag "nefeshapps-pos-frontend:${IMAGE_TAG}" \
            --tag "nefeshapps-pos-frontend:sha-${{ github.sha }}" \
            .

      - name: Save image to tarball
        run: |
          docker save "nefeshapps-pos-frontend:${IMAGE_TAG}" | gzip > /tmp/image.tar.gz
          ls -la /tmp/image.tar.gz
          echo "  size: $(du -h /tmp/image.tar.gz | cut -f1)"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: SCP image to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          set -euo pipefail
          TARBALL="/tmp/image-${{ github.sha }}.tar.gz"
          echo "scp /tmp/image.tar.gz ${HETZNER_USER}@${HETZNER_HOST}:${TARBALL}"
          scp -o StrictHostKeyChecking=accept-new /tmp/image.tar.gz \
            "${HETZNER_USER}@${HETZNER_HOST}:${TARBALL}"
          echo "✓ transferred $(du -h /tmp/image.tar.gz | cut -f1)"

  deploy:
    name: SSH · load · compose up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: production

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Deploy on Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
          IMAGE_TAG:   ${{ env.IMAGE_TAG }}
          DEPLOY_DIR:  ${{ env.DEPLOY_DIR }}
          COMPOSE:     ${{ env.COMPOSE }}
          CONTAINER:   ${{ env.CONTAINER }}
          IMAGE_SHA:   sha-${{ github.sha }}
        run: |
          set -euo pipefail
          TARBALL="/tmp/image-${{ github.sha }}.tar.gz"
          echo "Loading $TARBALL on $HETZNER_USER@$HETZNER_HOST"

          ssh "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "${TARBALL}" "${DEPLOY_DIR}" "${COMPOSE}" \
              "${IMAGE_TAG}" "${IMAGE_SHA}" "${CONTAINER}" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          TARBALL="$1"; shift
          DEPLOY_DIR="$1"; shift
          COMPOSE="$1"; shift
          IMAGE_TAG="$1"; shift
          IMAGE_SHA="$1"; shift
          CONTAINER="$1"; shift

          echo "→ cd ${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          echo "→ docker load -i ${TARBALL}"
          docker load -i "${TARBALL}"

          echo "→ re-tag to :${IMAGE_TAG}"
          docker tag "nefeshapps-pos-frontend:${IMAGE_TAG}" \
                     "nefeshapps-pos-frontend:${IMAGE_TAG}"  # already correct
          docker tag "nefeshapps-pos-frontend:${IMAGE_TAG}" \
                     "nefeshapps-pos-frontend:${IMAGE_SHA}"

          echo "→ docker compose -f ${COMPOSE} up -d --build"
          docker compose -f "${COMPOSE}" up -d --build

          echo "→ docker image prune -f (dangling only)"
          docker image prune -f

          echo "→ cleanup local tarball"
          rm -f "${TARBALL}"

          echo "→ container status"
          docker ps --filter "name=${CONTAINER}" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "→ image actually running"
          docker inspect --format '{{.Config.Image}}' "${CONTAINER}"
          REMOTE_SCRIPT

          echo "✓ deploy complete"

      - name: Notify success
        if: success()
        run: |
          echo "## 🚀 Production deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: nefeshapps-pos-frontend:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Production deploy failed for ${{ github.sha }}"
          echo "## 🚨 Production deploy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check: docker ps on the server, recent deploy logs" >> $GITHUB_STEP_SUMMARY
