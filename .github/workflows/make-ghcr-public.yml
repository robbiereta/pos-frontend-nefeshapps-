name: Make GHCR package public (one-shot)

# ============================================================
# One-shot workflow: flips the ghcr.io/robbiereta/pos-frontend
# package from private to public so the server can `docker pull`
# it without needing a token with packages:read.
#
# The GITHUB_TOKEN used by workflows has packages:write for
# packages that the same token pushed. Personal PATs (even
# fine-grained ones) don't have this scope for packages they
# didn't push themselves, hence this workflow.
#
# This workflow is intentionally not part of any CI pipeline.
# Run it ONCE via workflow_dispatch, then delete the file.
# ============================================================

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  make-public:
    name: Flip package to public
    runs-on: ubuntu-latest
    steps:
      - name: Set package visibility to public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="robbiereta"
          PKG="pos-frontend"
          # Discover which endpoint works (user vs org). For
          # personal repos with package ownership, it's the
          # /user endpoint.
          HTTP=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X PATCH \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d '{"visibility":"public"}' \
            "https://api.github.com/user/packages/container/${PKG}")
          echo "user endpoint: HTTP ${HTTP}"
          cat /tmp/r.json | python3 -m json.tool 2>/dev/null | head -20

          if [ "${HTTP}" != "200" ]; then
            echo "::error::Failed to make package public. See response above."
            exit 1
          fi

          echo ""
          echo "✓ package is now public"
          echo "  → docker pull ghcr.io/${OWNER}/${PKG}:staging  (no auth needed)"
          echo ""
          echo "After verifying the deploy works, delete this workflow file:"
          echo "  rm .github/workflows/make-ghcr-public.yml"
          echo "  git commit -am 'chore: remove one-shot visibility workflow'"
