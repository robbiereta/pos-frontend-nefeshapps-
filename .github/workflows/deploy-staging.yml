name: Deploy to Staging

# ============================================================
# Auto-deploy to staging on push to Staging.
# Same pipeline as deploy-prod.yml but:
#   - pushes the image as :staging (and :sha-<short>)
#   - SSHes into the same Hetzner box
#   - cd's into /nefeshapps/staging (separate from prod)
#   - uses docker-compose.staging.yml
#   - runs the container on host port 3004 (prod uses 3002)
#
# Prod and staging run side by side on the same Hetzner
# server, isolated by:
#   - separate directories (/nefeshapps vs /nefeshapps/staging)
#   - separate compose files
#   - separate GHCR tags (:latest vs :staging)
#   - separate container names
# ============================================================

on:
  push:
    branches: [Staging]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "Dockerfile"
      - "docker-compose.staging.yml"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME:   ghcr.io/robbiereta/pos-frontend
  TAG_STAGING:  staging
  TAG_SHA:      sha-${{ github.sha }}
  DEPLOY_DIR:   /nefeshapps/staging
  COMPOSE_FILE: docker-compose.staging.yml

jobs:
  build-and-push:
    name: Build image & push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.TAG_STAGING }}
            ${{ env.IMAGE_NAME }}:${{ env.TAG_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH · pull · compose up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    environment: staging

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Deploy on Hetzner
        env:
          HETZNER_HOST:  ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER:  ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
          IMAGE_NAME:    ${{ env.IMAGE_NAME }}
          TAG_STAGING:   ${{ env.TAG_STAGING }}
          TAG_SHA:       ${{ env.TAG_SHA }}
          DEPLOY_DIR:    ${{ env.DEPLOY_DIR }}
          COMPOSE_FILE:  ${{ env.COMPOSE_FILE }}
          GHCR_USER:     ${{ github.actor }}
          GHCR_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FULL_SHA="${IMAGE_NAME}:${TAG_SHA}"
          FULL_STAGING="${IMAGE_NAME}:${TAG_STAGING}"
          echo "Deploying ${FULL_SHA} → ${HETZNER_USER}@${HETZNER_HOST}:${DEPLOY_DIR}"

          ssh "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "${DEPLOY_DIR}" "${COMPOSE_FILE}" \
              "${FULL_SHA}" "${FULL_STAGING}" \
              "${GHCR_USER}" "${GHCR_TOKEN}" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="$1"; shift
          COMPOSE_FILE="$1"; shift
          FULL_SHA="$1"; shift
          FULL_STAGING="$1"; shift
          GHCR_USER="$1"; shift
          GHCR_TOKEN="$1"; shift

          echo "→ Login to GHCR (one-shot)"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin >/dev/null

          echo "→ mkdir -p ${DEPLOY_DIR} (idempotent)"
          mkdir -p "${DEPLOY_DIR}"

          echo "→ cd ${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          echo "→ ensure docker-compose.staging.yml is in place"
          if [ ! -f "${COMPOSE_FILE}" ]; then
            echo "::error::${COMPOSE_FILE} missing in ${DEPLOY_DIR} on the server"
            exit 1
          fi

          echo "→ docker pull ${FULL_SHA}"
          docker pull "${FULL_SHA}"

          echo "→ re-tag ${FULL_SHA} → ${FULL_STAGING}"
          docker tag "${FULL_SHA}" "${FULL_STAGING}"

          echo "→ docker compose -f ${COMPOSE_FILE} up -d --build"
          docker compose -f "${COMPOSE_FILE}" up -d --build

          echo "→ prune dangling images"
          docker image prune -f

          echo "→ container status"
          docker ps --filter "label=env=staging" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "→ image actually running"
          docker inspect --format '{{.Config.Image}}' nefeshapps-pos-frontend-staging
          REMOTE_SCRIPT

          echo "✓ staging deploy complete"

      - name: Notify success
        if: success()
        run: |
          echo "## 🚀 Staging deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.IMAGE_NAME }}:${{ env.TAG_SHA }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed for ${{ github.sha }}"
          echo "## 🚨 Staging deploy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check: docker ps on the server, recent deploy logs" >> $GITHUB_STEP_SUMMARY
