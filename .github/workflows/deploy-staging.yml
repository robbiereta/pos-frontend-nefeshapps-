name: Deploy to Staging

# ============================================================
# Auto-deploy to staging on push to Staging.
# Same pattern as deploy-prod.yml: build → save → scp → docker
# load on the server. No GHCR pull (works with private packages).
#
# The staging image gets the :staging tag (compose file
# references it), and the staging container runs on host port
# 3004 (prod uses 3002). Both can run side by side on the same
# Hetzner box.
# ============================================================

on:
  push:
    branches: [Staging]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "Dockerfile"
      - "docker-compose.staging.yml"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE_TAG:  staging
  DEPLOY_DIR: /nefeshapps/staging
  COMPOSE:    docker-compose.staging.yml
  CONTAINER:  nefeshapps-pos-frontend-staging

jobs:
  build:
    name: Build image & SCP to server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker buildx build --load \
            --tag "nefeshapps-pos-frontend:${IMAGE_TAG}" \
            --tag "nefeshapps-pos-frontend:sha-${{ github.sha }}" \
            .

      - name: Save image to tarball
        run: |
          docker save "nefeshapps-pos-frontend:${IMAGE_TAG}" | gzip > /tmp/image.tar.gz
          ls -la /tmp/image.tar.gz

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: SCP image + compose to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          set -euo pipefail
          TARBALL="/tmp/image-staging-${{ github.sha }}.tar.gz"
          echo "→ scp image"
          scp -o StrictHostKeyChecking=accept-new /tmp/image.tar.gz \
            "${HETZNER_USER}@${HETZNER_HOST}:${TARBALL}"
          echo "→ scp compose (keeps server in sync with the repo)"
          scp -o StrictHostKeyChecking=accept-new docker-compose.staging.yml \
            "${HETZNER_USER}@${HETZNER_HOST}:/nefeshapps/staging/docker-compose.staging.yml" || true
          echo "✓ transferred"

  deploy:
    name: SSH · load · compose up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: staging

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Deploy on Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
          IMAGE_TAG:   ${{ env.IMAGE_TAG }}
          DEPLOY_DIR:  ${{ env.DEPLOY_DIR }}
          COMPOSE:     ${{ env.COMPOSE }}
          CONTAINER:   ${{ env.CONTAINER }}
          IMAGE_SHA:   sha-${{ github.sha }}
        run: |
          set -euo pipefail
          TARBALL="/tmp/image-staging-${{ github.sha }}.tar.gz"
          echo "Loading $TARBALL on $HETZNER_USER@$HETZNER_HOST"

          ssh -o StrictHostKeyChecking=accept-new \
              "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "${TARBALL}" "${DEPLOY_DIR}" "${COMPOSE}" \
              "${IMAGE_TAG}" "${IMAGE_SHA}" "${CONTAINER}" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          TARBALL="$1"; shift
          DEPLOY_DIR="$1"; shift
          COMPOSE="$1"; shift
          IMAGE_TAG="$1"; shift
          IMAGE_SHA="$1"; shift
          CONTAINER="$1"; shift

          echo "→ mkdir -p ${DEPLOY_DIR} (idempotent)"
          mkdir -p "${DEPLOY_DIR}"

          echo "→ cd ${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          echo "→ ensure ${COMPOSE} is in place (SCP'd by the runner)"
          if [ ! -f "${COMPOSE}" ]; then
            echo "::error::${COMPOSE} missing in ${DEPLOY_DIR} on the server (SCP must have failed)"
            exit 1
          fi

          echo "→ docker load -i ${TARBALL}"
          docker load -i "${TARBALL}"

          echo "→ re-tag to :${IMAGE_TAG}"
          docker tag "nefeshapps-pos-frontend:${IMAGE_TAG}" \
                     "nefeshapps-pos-frontend:${IMAGE_TAG}"
          docker tag "nefeshapps-pos-frontend:${IMAGE_TAG}" \
                     "nefeshapps-pos-frontend:${IMAGE_SHA}"

          echo "→ docker compose -f ${COMPOSE} up -d --build"
          docker compose -f "${COMPOSE}" up -d --build

          echo "→ docker image prune -f"
          docker image prune -f

          echo "→ cleanup local tarball"
          rm -f "${TARBALL}"

          echo "→ container status"
          docker ps --filter "label=env=staging" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "→ image actually running"
          docker inspect --format '{{.Config.Image}}' "${CONTAINER}"
          REMOTE_SCRIPT

          echo "✓ staging deploy complete"

      - name: Notify success
        if: success()
        run: |
          echo "## 🚀 Staging deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: nefeshapps-pos-frontend:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed for ${{ github.sha }}"
          echo "## 🚨 Staging deploy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check: docker ps on the server, recent deploy logs" >> $GITHUB_STEP_SUMMARY
