name: Deploy to Staging

# ============================================================
# Auto-deploy to staging on push to Staging.
# Same save+SCP pattern as deploy-prod.yml but:
#   - pushes to /nefeshapps/staging (separate from prod)
#   - uses docker-compose.staging.yml
#   - container name: nefeshapps-pos-frontend-staging
#   - host port: 3004 (prod uses 3002)
# ============================================================

on:
  push:
    branches: [Staging]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - "Dockerfile"
      - "docker-compose.staging.yml"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE_NAME:    nefeshapps-pos-frontend
  IMAGE_TAG:     sha-${{ github.sha }}
  DEPLOY_DIR:    /nefeshapps/staging
  COMPOSE_FILE:  docker-compose.staging.yml
  CONTAINER:     nefeshapps-pos-frontend-staging

jobs:
  build-and-ship:
    name: Build image + SCP to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Add Hetzner host key to known_hosts
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${HETZNER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          echo "added host key for ${HETZNER_HOST}"

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Save image to tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/npos-deploy
          docker save "${IMAGE_NAME}:${IMAGE_TAG}" \
            | gzip > "/tmp/npos-deploy/${IMAGE_TAG}.tar.gz"
          ls -lh "/tmp/npos-deploy/${IMAGE_TAG}.tar.gz"

      - name: Ensure remote dirs exist
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" "mkdir -p ${DEPLOY_DIR} /tmp/npos-deploy"

      - name: SCP tarball to server
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          scp "/tmp/npos-deploy/${IMAGE_TAG}.tar.gz" \
              "${HETZNER_USER}@${HETZNER_HOST}:/tmp/npos-deploy/${IMAGE_TAG}.tar.gz"

      - name: Load + tag + compose up on Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "${DEPLOY_DIR}" "${COMPOSE_FILE}" \
              "${IMAGE_NAME}:${IMAGE_TAG}" "${CONTAINER}" \
              "/tmp/npos-deploy/${IMAGE_TAG}.tar.gz" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="$1"; shift
          COMPOSE_FILE="$1"; shift
          FULL_TAG="$1"; shift
          CONTAINER="$1"; shift
          TARBALL="$1"; shift

          mkdir -p "${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          if [ ! -f "${COMPOSE_FILE}" ]; then
            echo "::error::${COMPOSE_FILE} missing in ${DEPLOY_DIR} on the server"
            exit 1
          fi

          echo "→ docker load < tarball"
          docker load -i "${TARBALL}"

          echo "→ tag the loaded image (so compose picks it up by name)"
          LOADED=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "$(echo "${FULL_TAG}" | cut -d: -f1)" \
            | head -1)
          if [ -n "${LOADED}" ] && [ "${LOADED}" != "${FULL_TAG}" ]; then
            docker tag "${LOADED}" "${FULL_TAG}"
          fi

          echo "→ re-tag the :staging tag (compose file pins to this tag)"
          docker tag "${FULL_TAG}" "nefeshapps-pos-frontend:staging"

          echo "→ docker compose -f ${COMPOSE_FILE} up -d --build"
          docker compose -f "${COMPOSE_FILE}" up -d --build

          echo "→ prune dangling images"
          docker image prune -f

          echo "→ container status"
          docker ps --filter "label=env=staging" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "→ image actually running"
          docker inspect --format '{{.Config.Image}}' "${CONTAINER}"

          echo "→ cleanup tarball"
          rm -f "${TARBALL}"
          REMOTE_SCRIPT

      - name: Notify success
        if: success()
        run: |
          echo "## 🚀 Staging deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed for ${{ github.sha }}"
          echo "## 🚨 Staging deploy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Check: docker ps on the server, recent deploy logs" >> $GITHUB_STEP_SUMMARY
