name: Deploy to Staging

on:
  push:
    branches: [Staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Hetzner (Staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (staging)
        run: npm run build
        env:
          VITE_API_URL: https://cfdis.nefeshapps.site

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build and save Docker image
        run: |
          docker build -f Dockerfile -t nefeshapps-pos-frontend:staging .
          docker save nefeshapps-pos-frontend:staging | gzip > /tmp/frontend-staging.tar.gz

      - name: Transfer image to Hetzner
        run: |
          scp /tmp/frontend-staging.tar.gz root@${{ secrets.HETZNER_IP }}:/tmp/
          echo "✅ Image transferred to Hetzner"

      - name: Deploy on Hetzner
        run: |
          ssh root@${{ secrets.HETZNER_IP }} << 'EOF'
          set -e
          mkdir -p /nefeshapps/staging
          cd /nefeshapps/staging
          echo "🐳 Stopping existing staging container..."
          docker compose -f docker-compose.staging.yml down 2>/dev/null || true

          echo "📥 Loading Docker image..."
          docker load -i /tmp/frontend-staging.tar.gz

          echo "🚀 Starting staging frontend container..."
          docker compose -f docker-compose.staging.yml up -d || true

          echo "✅ Container running:"
          docker ps --filter "label=env=staging" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "🧹 Cleanup..."
          rm -f /tmp/frontend-staging.tar.gz
          EOF

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Frontend deployed to STAGING"
          echo "## 🚀 Staging deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Service: pos-frontend (staging)" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed"
          echo "## 🚨 Staging deployment failed" >> $GITHUB_STEP_SUMMARY
