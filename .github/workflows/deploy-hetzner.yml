name: Deploy to Hetzner

# ============================================================
# SSH-less deploy to the Hetzner Cloud server.
#
# Pipeline:
#   1. Build the Vite bundle (VITE_API_URL baked in)
#   2. Upload dist/ to Hetzner Object Storage (S3-compatible)
#   3. Hetzner Cloud API → update server label "npos.deploy.sha"
#      The deploy-agent on the server polls the Hetzner metadata
#      API every 10s, sees the new label, pulls from S3, swaps
#      the nginx container's html dir, and reloads nginx.
#   4. HTTP health-check the public URL
#   5. (Optional) Hetzner API → create_image snapshot
#
# No SSH key is ever stored in GitHub Secrets. The server-side
# agent was installed once via SSH using server/deploy-agent/install.sh
# and is configured to run as a systemd service.
#
# Required GitHub Secrets:
#   HETZNER_API_TOKEN    — Hetzner Cloud API token (Read & Write)
#   HETZNER_SERVER_ID    — Numeric server ID
#   HETZNER_S3_ENDPOINT  — Hetzner Object Storage endpoint
#                          (e.g. https://fsn1.your-objectstorage.com)
#   HETZNER_S3_BUCKET    — Bucket name (e.g. npos-dist)
#   HETZNER_S3_ACCESS_KEY
#   HETZNER_S3_SECRET_KEY
#   HETZNER_S3_REGION    — (optional var) fsn1, nbg1, etc.
#   HETZNER_HEALTH_URL   — Public URL to health-check
#   VITE_API_URL         — Backend URL baked into the bundle
#   CONTAINER_NAME       — (optional var) defaults to npos-frontend
# ============================================================

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Skip pre-deploy health check"
        type: boolean
        default: false
      skip_snapshot:
        description: "Skip post-deploy snapshot"
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "index.html"
      - ".github/workflows/deploy-hetzner.yml"

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

env:
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'npos-frontend' }}
  DEPLOY_LABEL:   "npos.deploy.sha"
  S3_PREFIX:      "dist/"

jobs:
  deploy:
    name: Build, upload, signal deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Verify dist/ was produced
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing" && exit 1)
          echo "Build artifacts:"
          ls -la dist | head -20

      # ─── Hetzner Cloud API: pre-flight ────────────────────
      - name: Hetzner API · check server status
        if: ${{ !inputs.force }}
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_SERVER_ID: ${{ secrets.HETZNER_SERVER_ID }}
        run: |
          set -euo pipefail
          STATUS=$(curl -fsS \
            -H "Authorization: Bearer ${HETZNER_API_TOKEN}" \
            "https://api.hetzner.cloud/v1/servers/${HETZNER_SERVER_ID}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['server']['status'])")
          echo "Server status: ${STATUS}"
          if [ "${STATUS}" != "running" ]; then
            echo "::error::Server is not running (status: ${STATUS}). Aborting deploy."
            exit 1
          fi

      # ─── Upload dist/ to Hetzner Object Storage ───────────
      - name: Upload dist/ to Hetzner Object Storage
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION:    ${{ vars.HETZNER_S3_REGION || 'fsn1' }}
          HETZNER_S3_ENDPOINT:   ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_BUCKET:     ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          set -euo pipefail
          # aws-cli talks to any S3-compatible endpoint via --endpoint-url
          # We upload the dist/ contents (not the directory itself) under
          # the S3_PREFIX so the agent can pull dist/ cleanly.
          aws --endpoint-url "${HETZNER_S3_ENDPOINT}" \
              s3 sync dist/ "s3://${HETZNER_S3_BUCKET}/${S3_PREFIX}" \
              --delete \
              --cache-control "public, max-age=31536000, immutable" \
              --exclude "index.html" \
              --exclude "sw.js" \
              --exclude "manifest.webmanifest"
          # index.html, sw.js, manifest get no-cache so the agent re-serves
          # them on every deploy.
          aws --endpoint-url "${HETZNER_S3_ENDPOINT}" \
              s3 cp dist/index.html "s3://${HETZNER_S3_BUCKET}/${S3_PREFIX}index.html" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "text/html"
          [ -f dist/sw.js ] && aws --endpoint-url "${HETZNER_S3_ENDPOINT}" \
              s3 cp dist/sw.js "s3://${HETZNER_S3_BUCKET}/${S3_PREFIX}sw.js" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "application/javascript" || true
          [ -f dist/manifest.webmanifest ] && aws --endpoint-url "${HETZNER_S3_ENDPOINT}" \
              s3 cp dist/manifest.webmanifest "s3://${HETZNER_S3_BUCKET}/${S3_PREFIX}manifest.webmanifest" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --content-type "application/manifest+json" || true
          echo "✓ uploaded"

      # ─── Hetzner Cloud API: signal deploy via label ──────
      - name: Hetzner API · update deploy label
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_SERVER_ID: ${{ secrets.HETZNER_SERVER_ID }}
          DEPLOY_LABEL:      ${{ env.DEPLOY_LABEL }}
          NEW_SHA:           ${{ github.sha }}
        run: |
          set -euo pipefail
          PAYLOAD=$(python3 -c "import json; print(json.dumps({'labels': {env_label: env_sha}}))" \
            -e "import os; print()" 2>/dev/null || echo "")
          # ^ python path is fragile; build payload directly:
          PAYLOAD=$(cat <<EOF
          {"labels":{"${DEPLOY_LABEL}":"${NEW_SHA}"}}
          EOF
          )
          RESP=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${HETZNER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "https://api.hetzner.cloud/v1/servers/${HETZNER_SERVER_ID}/actions/change_labels")
          echo "${RESP}" | python3 -m json.tool | head -10
          echo "✓ deploy signaled (sha=${NEW_SHA})"

      # ─── Health check (no SSH — public HTTP) ─────────────
      - name: Health check (wait for agent to pick up label)
        env:
          HEALTH_URL: ${{ secrets.HETZNER_HEALTH_URL }}
        run: |
          set -euo pipefail
          # The agent polls every 10s. Allow up to 90s for the
          # label change to propagate, the S3 download to finish,
          # and nginx to reload.
          HTTP_CODE="000"
          for i in $(seq 1 9); do
            sleep 10
            HTTP_CODE=$(curl -fsS --max-time 5 \
              -o /dev/null -w "%{http_code}" \
              "${HEALTH_URL}" 2>/dev/null || echo "000")
            echo "attempt $i ($(date +%H:%M:%S)): HTTP ${HTTP_CODE}"
            if [ "${HTTP_CODE}" = "200" ]; then
              break
            fi
          done
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Health check failed after 90s (HTTP ${HTTP_CODE})"
            echo "Check the deploy-agent logs on the server:"
            echo "  journalctl -u deploy-agent.service -n 100"
            exit 1
          fi

      # ─── Hetzner Cloud API: post-deploy snapshot ──────────
      - name: Hetzner API · post-deploy snapshot
        if: ${{ always() && !inputs.skip_snapshot }}
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          HETZNER_SERVER_ID: ${{ secrets.HETZNER_SERVER_ID }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${HETZNER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"description":"post-deploy-${{ github.sha }}-${{ job.status }}","type":"snapshot"}' \
            "https://api.hetzner.cloud/v1/servers/${HETZNER_SERVER_ID}/actions/create_image" \
            | python3 -m json.tool

  rollback:
    name: Rollback · revert to previous image
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production
    steps:
      - name: Hetzner API · list snapshots
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${HETZNER_API_TOKEN}" \
            "https://api.hetzner.cloud/v1/images?type=snapshot&sort=created:desc" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          print('Recent snapshots:')
          for img in data['images'][:5]:
            print(f\"  id={img['id']}  desc={img.get('description','')}  created={img['created']}\")"

      - name: "Manual rollback instructions"
        run: |
          echo "::error::Deploy failed. To rollback, set the npos.deploy.sha label to the previous SHA via:"
          echo "  curl -X POST -H \"Authorization: Bearer \$HETZNER_API_TOKEN\" -H \"Content-Type: application/json\" \\"
          echo "    -d '{\"labels\":{\"npos.deploy.sha\":\"<previous-sha>\"}}' \\"
          echo "    https://api.hetzner.cloud/v1/servers/\$HETZNER_SERVER_ID/actions/change_labels"
          echo "  The agent will see the older SHA in the previous snapshot's S3 state and redeploy it."
          echo "  Or rebuild the server from a snapshot image (destructive):"
          echo "  curl -X POST -H \"Authorization: Bearer \$HETZNER_API_TOKEN\" -H \"Content-Type: application/json\" \\"
          echo "    -d '{\"image\":<id>,\"start_after_create\":true}' \\"
          echo "    https://api.hetzner.cloud/v1/servers/\$HETZNER_SERVER_ID/actions/rebuild"
          exit 1
