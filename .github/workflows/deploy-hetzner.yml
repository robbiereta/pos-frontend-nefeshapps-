name: Deploy to Hetzner (manual)

# ============================================================
# Manual dispatch: build the image at the current commit and
# deploy it. Same save+SCP pattern as deploy-prod.yml /
# deploy-staging.yml. Pick the target directory (prod or
# staging) — uses the same docker-compose + container as the
# auto-deploys.
#
# Use this for:
#   - testing a fix without waiting for the branch deploy
#   - redeploying master/staging after a manual rollback
#   - smoke-testing the deploy pipeline
# ============================================================

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

concurrency:
  group: deploy-hetzner-manual
  cancel-in-progress: false

jobs:
  build-and-ship:
    name: Build image + SCP to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Add Hetzner host key to known_hosts
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${HETZNER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          echo "added host key for ${HETZNER_HOST}"

      - name: Resolve target paths
        id: paths
        env:
          TGT: ${{ inputs.target }}
        run: |
          case "${TGT}" in
            production)
              echo "deploy_dir=/nefeshapps"       >> "$GITHUB_OUTPUT"
              echo "compose_file=docker-compose.yml" >> "$GITHUB_OUTPUT"
              echo "container=nefeshapps-pos-frontend" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "deploy_dir=/nefeshapps/staging"   >> "$GITHUB_OUTPUT"
              echo "compose_file=docker-compose.staging.yml" >> "$GITHUB_OUTPUT"
              echo "container=nefeshapps-pos-frontend-staging" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown target: ${TGT}"
              exit 1
              ;;
          esac

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: nefeshapps-pos-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Save image to tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/npos-deploy
          docker save "nefeshapps-pos-frontend:sha-${{ github.sha }}" \
            | gzip > "/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz"
          ls -lh "/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz"

      - name: Ensure remote dirs exist
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" "mkdir -p ${{ steps.paths.outputs.deploy_dir }} /tmp/npos-deploy"

      - name: SCP tarball to server
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          scp "/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz" \
              "${HETZNER_USER}@${HETZNER_HOST}:/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz"

      - name: Load + tag + compose up on Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "${{ steps.paths.outputs.deploy_dir }}" \
              "${{ steps.paths.outputs.compose_file }}" \
              "${{ steps.paths.outputs.container }}" \
              "/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz" \
              "nefeshapps-pos-frontend:sha-${{ github.sha }}" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="$1"; shift
          COMPOSE_FILE="$1"; shift
          CONTAINER="$1"; shift
          TARBALL="$1"; shift
          FULL_TAG="$1"; shift

          mkdir -p "${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          if [ ! -f "${COMPOSE_FILE}" ]; then
            echo "::error::${COMPOSE_FILE} missing in ${DEPLOY_DIR} on the server"
            exit 1
          fi

          echo "→ docker load < tarball"
          docker load -i "${TARBALL}"

          echo "→ tag the loaded image (so compose picks it up by name)"
          LOADED=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "$(echo "${FULL_TAG}" | cut -d: -f1)" \
            | head -1)
          if [ -n "${LOADED}" ] && [ "${LOADED}" != "${FULL_TAG}" ]; then
            docker tag "${LOADED}" "${FULL_TAG}"
          fi

          echo "→ docker compose -f ${COMPOSE_FILE} up -d --build"
          docker compose -f "${COMPOSE_FILE}" up -d --build

          echo "→ prune dangling images"
          docker image prune -f

          echo "→ container status"
          docker ps --filter "name=${CONTAINER}" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "→ image actually running"
          docker inspect --format '{{.Config.Image}}' "${CONTAINER}"

          echo "→ cleanup tarball"
          rm -f "${TARBALL}"
          REMOTE_SCRIPT

      - name: Notify success
        if: success()
        run: |
          echo "## 🚀 Manual deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Manual deploy failed"
          echo "## 🚨 Manual deploy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- Target: ${{ inputs.target }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
