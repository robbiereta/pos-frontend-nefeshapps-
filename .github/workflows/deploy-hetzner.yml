name: Deploy to Hetzner (manual)

# ============================================================
# Manual deploy with tag/env selection. Same SSH+pull+compose
# flow as deploy-prod.yml / deploy-staging.yml, but with
# workflow_dispatch inputs so you can:
#   - pick a tag from the existing images in GHCR
#   - pick the env (prod / staging)
#   - force a re-pull of an existing tag
#
# Useful for:
#   - redeploying a previous SHA without rebuilding
#   - promoting a specific commit between envs
#   - smoke-testing a fix
# ============================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
      tag:
        description: "Image tag to deploy (sha-<commit> or branch name)"
        type: string
        required: true
        default: "latest"
      force_pull:
        description: "Always pull even if image is cached locally"
        type: boolean
        default: true

concurrency:
  group: deploy-hetzner-manual
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/robbiereta/pos-frontend

jobs:
  deploy:
    name: SSH · pull · compose up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Resolve env-specific paths
        id: paths
        env:
          ENV: ${{ inputs.environment }}
        run: |
          case "${ENV}" in
            production)
              echo "deploy_dir=/nefeshapps"       >> "$GITHUB_OUTPUT"
              echo "compose_file=docker-compose.yml" >> "$GITHUB_OUTPUT"
              echo "container=nefeshapps-pos-frontend" >> "$GITHUB_OUTPUT"
              echo "image_tag=latest"             >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "deploy_dir=/nefeshapps/staging"   >> "$GITHUB_OUTPUT"
              echo "compose_file=docker-compose.staging.yml" >> "$GITHUB_OUTPUT"
              echo "container=nefeshapps-pos-frontend-staging" >> "$GITHUB_OUTPUT"
              echo "image_tag=staging"              >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown environment: ${ENV}"
              exit 1
              ;;
          esac

      - name: Deploy on Hetzner
        env:
          HETZNER_HOST:  ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER:  ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
          IMAGE_NAME:    ${{ env.IMAGE_NAME }}
          TAG:           ${{ inputs.tag }}
          FORCE_PULL:    ${{ inputs.force_pull }}
          GHCR_USER:     ${{ github.actor }}
          GHCR_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR:    ${{ steps.paths.outputs.deploy_dir }}
          COMPOSE_FILE:  ${{ steps.paths.outputs.compose_file }}
          CONTAINER:     ${{ steps.paths.outputs.container }}
        run: |
          set -euo pipefail
          FULL_TAG="${IMAGE_NAME}:${TAG}"
          echo "Deploying ${FULL_TAG} → ${HETZNER_USER}@${HETZNER_HOST}:${DEPLOY_DIR}"

          ssh "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "${DEPLOY_DIR}" "${COMPOSE_FILE}" \
              "${FULL_TAG}" "${CONTAINER}" \
              "${GHCR_USER}" "${GHCR_TOKEN}" \
              "${FORCE_PULL}" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="$1"; shift
          COMPOSE_FILE="$1"; shift
          FULL_TAG="$1"; shift
          CONTAINER="$1"; shift
          GHCR_USER="$1"; shift
          GHCR_TOKEN="$1"; shift
          FORCE_PULL="$1"; shift

          echo "→ Login to GHCR (one-shot)"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin >/dev/null

          cd "${DEPLOY_DIR}"

          if [ "${FORCE_PULL}" = "true" ]; then
            echo "→ docker pull ${FULL_TAG} (force)"
            docker pull "${FULL_TAG}"
          else
            # Check if image exists locally first
            if docker image inspect "${FULL_TAG}" >/dev/null 2>&1; then
              echo "→ image present locally, skipping pull"
            else
              echo "→ docker pull ${FULL_TAG}"
              docker pull "${FULL_TAG}"
            fi
          fi

          echo "→ docker compose -f ${COMPOSE_FILE} up -d --build"
          docker compose -f "${COMPOSE_FILE}" up -d --build

          echo "→ container status"
          docker ps --filter "name=${CONTAINER}" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "→ image actually running"
          docker inspect --format '{{.Config.Image}}' "${CONTAINER}"
          REMOTE_SCRIPT

          echo "✓ manual deploy complete"

      - name: Notify success
        if: success()
        run: |
          echo "## 🚀 Manual deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Manual deploy failed"
          echo "## 🚨 Manual deploy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
