name: Deploy to Hetzner (manual)

# ============================================================
# Manual deploy with env selection. Same build → save → scp →
# load pipeline as deploy-prod.yml / deploy-staging.yml.
# Works without GHCR access (private package friendly).
#
# Inputs:
#   environment — prod or staging
#   image_tag   — logical label for the loaded image (default:
#                 manual-<short-sha>)
# ============================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
      image_tag:
        description: "Logical label for the loaded image (overrides the default manual-<sha>)"
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-hetzner-manual
  cancel-in-progress: false

jobs:
  build:
    name: Build image & SCP to server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (always rebuilds from current branch)
        env:
          ENV: ${{ inputs.environment }}
          TAG: ${{ inputs.image_tag }}
        run: |
          # The compose file expects a specific local tag depending on env.
          # We always build once and tag it twice (or more) so it can be
          # loaded on the server with the right name.
          case "${ENV}" in
            production) PRIMARY_TAG="latest" ;;
            staging)    PRIMARY_TAG="staging" ;;
            *) echo "::error::unknown env: ${ENV}"; exit 1 ;;
          esac
          if [ -n "${TAG}" ]; then
            CUSTOM_TAG="${TAG}"
          else
            CUSTOM_TAG="manual-${PRIMARY_TAG}-${{ github.sha }}"
          fi
          echo "PRIMARY_TAG=${PRIMARY_TAG}" >> "$GITHUB_ENV"
          echo "CUSTOM_TAG=${CUSTOM_TAG}"  >> "$GITHUB_ENV"

          docker buildx build --load \
            --tag "nefeshapps-pos-frontend:${PRIMARY_TAG}" \
            --tag "nefeshapps-pos-frontend:${CUSTOM_TAG}" \
            --tag "nefeshapps-pos-frontend:sha-${{ github.sha }}" \
            .

      - name: Save image to tarball
        env:
          PRIMARY_TAG: ${{ env.PRIMARY_TAG }}
        run: |
          docker save "nefeshapps-pos-frontend:${PRIMARY_TAG}" | gzip > /tmp/image.tar.gz
          ls -la /tmp/image.tar.gz

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: SCP image to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          set -euo pipefail
          TARBALL="/tmp/image-manual-${{ github.sha }}.tar.gz"
          scp -o StrictHostKeyChecking=accept-new /tmp/image.tar.gz \
            "${HETZNER_USER}@${HETZNER_HOST}:${TARBALL}"
          echo "✓ transferred"

  deploy:
    name: SSH · load · compose up
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment: ${{ inputs.environment }}

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Deploy on Hetzner
        env:
          HETZNER_HOST:  ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER:  ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
          ENV:           ${{ inputs.environment }}
          PRIMARY_TAG:   ${{ env.PRIMARY_TAG }}
          CUSTOM_TAG:    ${{ env.CUSTOM_TAG }}
        run: |
          set -euo pipefail
          case "${ENV}" in
            production)
              DEPLOY_DIR="/nefeshapps"
              COMPOSE="docker-compose.yml"
              CONTAINER="nefeshapps-pos-frontend"
              ;;
            staging)
              DEPLOY_DIR="/nefeshapps/staging"
              COMPOSE="docker-compose.staging.yml"
              CONTAINER="nefeshapps-pos-frontend-staging"
              ;;
            *) echo "::error::unknown env: ${ENV}"; exit 1 ;;
          esac
          TARBALL="/tmp/image-manual-${{ github.sha }}.tar.gz"
          echo "Manual deploy → ${HETZNER_USER}@${HETZNER_HOST}:${DEPLOY_DIR} (env=${ENV}, primary_tag=${PRIMARY_TAG})"

          ssh -o StrictHostKeyChecking=accept-new \
              "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "${TARBALL}" "${DEPLOY_DIR}" "${COMPOSE}" \
              "${PRIMARY_TAG}" "${CONTAINER}" \
              "${CUSTOM_TAG}" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          TARBALL="$1"; shift
          DEPLOY_DIR="$1"; shift
          COMPOSE="$1"; shift
          PRIMARY_TAG="$1"; shift
          CONTAINER="$1"; shift
          CUSTOM_TAG="$1"; shift

          echo "→ mkdir -p ${DEPLOY_DIR}"
          mkdir -p "${DEPLOY_DIR}"

          echo "→ cd ${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          echo "→ ensure ${COMPOSE} is in place"
          if [ ! -f "${COMPOSE}" ]; then
            echo "::error::${COMPOSE} missing in ${DEPLOY_DIR} on the server"
            exit 1
          fi

          echo "→ docker load -i ${TARBALL}"
          docker load -i "${TARBALL}"

          echo "→ re-tag to :${PRIMARY_TAG} (the compose file expects this)"
          docker tag "nefeshapps-pos-frontend:${PRIMARY_TAG}" \
                     "nefeshapps-pos-frontend:${PRIMARY_TAG}"
          if [ -n "${CUSTOM_TAG}" ]; then
            docker tag "nefeshapps-pos-frontend:${PRIMARY_TAG}" \
                       "nefeshapps-pos-frontend:${CUSTOM_TAG}"
          fi

          echo "→ docker compose -f ${COMPOSE} up -d --build"
          docker compose -f "${COMPOSE}" up -d --build

          echo "→ docker image prune -f"
          docker image prune -f

          echo "→ cleanup local tarball"
          rm -f "${TARBALL}"

          echo "→ container status"
          docker ps --filter "name=${CONTAINER}" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

          echo "→ image actually running"
          docker inspect --format '{{.Config.Image}}' "${CONTAINER}"
          REMOTE_SCRIPT

          echo "✓ manual deploy complete"

      - name: Notify success
        if: success()
        run: |
          echo "## 🚀 Manual deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Primary tag: ${{ env.PRIMARY_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Custom tag:  ${{ env.CUSTOM_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Manual deploy failed"
          echo "## 🚨 Manual deploy FAILED" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Primary tag: ${{ env.PRIMARY_TAG }}" >> $GITHUB_STEP_SUMMARY
