name: CI

on:
  push:
    branches: [master, Staging]
  pull_request:
    branches: [master, Staging]

jobs:
  # ─── Fast PR check (no Docker) ──────────────────────────
  build:
    name: Install, Lint, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: |
          if grep -q '"lint"' package.json; then
            echo "Running lint..."
            npm run lint
          else
            echo "No lint script, skipping"
          fi
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.CI_VITE_API_URL || secrets.VITE_API_URL || 'https://cfdi.nefeshapps.site' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
        if: success()

      - name: CI summary
        if: always()
        run: |
          echo "## CI results" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ─── Docker image build + push to GHCR ─────────────────
  # Only runs on push to a branch (not on PRs from forks) so
  # we don't get billed for unknown code. Tagged with both
  # the branch name and the short SHA so deploys can pin to
  # either.
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Staging')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/robbiereta/pos-frontend
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/Staging' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          echo "## 🐳 Docker image" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: ${{ steps.meta.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
