name: Auto Deploy (self-trigger, no ruleset block)

# ============================================================
# Triggers on push to fix/deploy-save-scp ONLY.
# Does the full build + save + SCP + load + compose up.
# Works around the Staging ruleset (no need to touch Staging
# to deploy staging).
#
# This workflow IS the deploy. It does NOT call deploy-staging.yml.
# Once we're done, the change in deploy-staging.yml on
# fix/deploy-save-scp can be merged normally and deploy-staging.yml
# takes over for the long term.
# ============================================================

on:
  push:
    branches: [fix/deploy-save-scp]
  workflow_dispatch:

concurrency:
  group: auto-deploy-fix
  cancel-in-progress: false

jobs:
  ship:
    name: Build + SCP + load + compose up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging  # for any required reviewers/secrets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load to runner)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: nefeshapps-pos-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Save image to tarball
        run: |
          set -euo pipefail
          mkdir -p /tmp/npos-deploy
          docker save "nefeshapps-pos-frontend:sha-${{ github.sha }}" \
            | gzip > "/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz"
          ls -lh "/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz"

      - name: Ensure remote deploy dir
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" "mkdir -p /nefeshapps/staging"

      - name: SCP tarball
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          scp "/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz" \
              "${HETZNER_USER}@${HETZNER_HOST}:/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz"

      - name: Deploy on Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST || vars.HETZNER_HOST || '204.168.163.106' }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || vars.HETZNER_USER || 'root' }}
        run: |
          ssh "${HETZNER_USER}@${HETZNER_HOST}" bash -s -- \
              "/nefeshapps/staging" \
              "docker-compose.staging.yml" \
              "nefeshapps-pos-frontend-staging" \
              "/tmp/npos-deploy/sha-${{ github.sha }}.tar.gz" \
              "nefeshapps-pos-frontend:sha-${{ github.sha }}" \
            << 'REMOTE_SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="$1"; COMPOSE_FILE="$2"; CONTAINER="$3"
          TARBALL="$4"; FULL_TAG="$5"

          cd "${DEPLOY_DIR}"

          if [ ! -f "${COMPOSE_FILE}" ]; then
            echo "::error::${COMPOSE_FILE} missing in ${DEPLOY_DIR}"
            exit 1
          fi

          echo "→ docker load < tarball"
          docker load -i "${TARBALL}"

          echo "→ tag the loaded image (so compose picks it up)"
          LOADED=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "$(echo "${FULL_TAG}" | cut -d: -f1)" | head -1)
          if [ -n "${LOADED}" ] && [ "${LOADED}" != "${FULL_TAG}" ]; then
            docker tag "${LOADED}" "${FULL_TAG}"
          fi

          echo "→ also update the :staging tag (matches compose file)"
          docker tag "${FULL_TAG}" "nefeshapps-pos-frontend:staging"

          echo "→ docker compose up -d"
          docker compose -f "${COMPOSE_FILE}" up -d

          echo "→ prune dangling"
          docker image prune -f

          echo "→ container status"
          docker ps --filter "name=${CONTAINER}" \
            --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

          echo "→ running image id"
          docker inspect --format '{{.Config.Image}}' "${CONTAINER}"

          echo "→ container health"
          docker inspect --format '{{.State.Status}} since {{.State.StartedAt}}' "${CONTAINER}"

          echo "→ cleanup tarball"
          rm -f "${TARBALL}"
          REMOTE_SCRIPT

      - name: Notify
        if: always()
        run: |
          echo "## 🚀 Self-triggered deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Target: staging" >> $GITHUB_STEP_SUMMARY
          echo "- Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
