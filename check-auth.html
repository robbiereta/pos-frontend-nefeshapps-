<!DOCTYPE html>
<html>
<head>
  <title>Check Auth</title>
</head>
<body>
  <h1>Auth Check</h1>
  <div id="result"></div>

  <script>
    const token = localStorage.getItem('token');
    const user = localStorage.getItem('user');

    const result = document.getElementById('result');
    result.innerHTML = `
      <h2>LocalStorage Contents:</h2>
      <p><strong>Token:</strong> ${token ? token.substring(0, 50) + '...' : 'NOT FOUND'}</p>
      <p><strong>User:</strong> ${user || 'NOT FOUND'}</p>

      <h2>Test API Call:</h2>
      <div id="api-result">Testing...</div>
    `;

    // Test API call
    if (token) {
      fetch('http://localhost:5002/api/products?page=1&limit=20&activo=true', {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      })
      .then(res => {
        console.log('Response status:', res.status);
        return res.json();
      })
      .then(data => {
        console.log('Response data:', data);
        document.getElementById('api-result').innerHTML = `
          <p style="color: green;">✅ API call successful!</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      })
      .catch(err => {
        console.error('API error:', err);
        document.getElementById('api-result').innerHTML = `
          <p style="color: red;">❌ API call failed: ${err.message}</p>
        `;
      });
    } else {
      document.getElementById('api-result').innerHTML = `
        <p style="color: red;">❌ No token found. Please login first.</p>
        <a href="http://localhost:3000/login">Go to Login</a>
      `;
    }
  </script>
</body>
</html>
